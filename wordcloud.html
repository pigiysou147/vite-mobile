<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Cloud</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.3/wordcloud2.js"
      integrity="sha512-wQ35vn1edvCAanCE6SCI5cvj15AMU+wJcjvmsXy7JNaYsV1biOptt7ipjoI2neb0Ram5GE2lh/Tnpjta1WsntA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      #wordcloud {
        width: 100vw;
        height: 100vh;
        margin: 0 auto;
      }

      #wordcloud > span {
        opacity: 0;
      }

      #wordcloud > .opacity-1 {
        opacity: 1;
      }

      #wordcloud > .word0 {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <audio style="display: none" id="myAudio" controls autoplay>
      <source src="./public/voices/apple__us_1.mp3" type="audio/mpeg" />
      您的浏览器不支持音频播放。
    </audio>
    <div id="wordcloud"></div>
    <button id="start">start</button>

    <script>
      const color = ['#375606', '#88A610', '#423411', '#727411', '#73490F', '#A66B11']
      let spanEles = null
      let wordIndex = 1
      var duration
      let words = [
        ['apple', 20, 0],
        ['苹果', 10, 0],
      ]
      initWord()
      document.getElementById('start').addEventListener('click', () => {
        audio.play()
      })
      const audio = document.getElementById('myAudio')
      audio.addEventListener('ended', () => {
        console.log('ended', wordIndex)
        if (wordIndex * 2 >= words.length) return
        audio.play()
        const nextWords = document.querySelectorAll('.word' + wordIndex++)
        nextWords.forEach((el) => {
          el.classList.add('opacity-1')
        })
      })
      // 当音频元数据加载完成后获取总时长
      audio.addEventListener('canplay', () => {
        duration = audio.duration // 获取总时长（秒）
        console.log('duration :>> ', duration)
        //audio.play()
      })
      function initWord(duration) {
        // 初始词云数据
        for (var i = 1; i <= 20; i++) {
          const newWord = ['apple', Math.random() * 10 + 2, i]
          const cnWord = ['苹果', Math.random() * 7 + 2, i]
          // 添加新词到词云数据
          words.push(newWord)
          words.push(cnWord)
        }
        // 配置词云
        const options = {
          list: words,
          gridSize: 10,
          weightFactor: 4,
          fontFamily: 'Finger Paint, cursive, sans-serif',
          //color: 'random-dark',
          //wait: duration,
          rotateRatio: 0.5,
          //shape: 'cardioid',
          shrinkToFit: true,
          //rotationSteps: 2,
          color: function (word, _, __, extraData) {
            return color[extraData % color.length]
          },
          //backgroundColor: '#ffe0e0',
          classes: (word, _, __, extraData) => {
            return 'word' + extraData[0]
          },
        }
        const wordcloudEle = document.getElementById('wordcloud')
        wordcloudEle.addEventListener('wordcloudstart', () => {
          console.log('wordcloud  :>> wordcloudstart')
        })
        wordcloudEle.addEventListener('wordcloudstop', () => {
          //audio.pause()
          console.log('wordcloud  :>> wordcloudstop')
          spanEles = wordcloudEle.children
        })
        // 初始化词云
        WordCloud(wordcloudEle, options)
      }
    </script>
  </body>
</html>
